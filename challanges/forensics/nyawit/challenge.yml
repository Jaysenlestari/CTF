category: forensics

# This is the challenge description. Make sure you include the
# necessary URLs / netcat strings here.
# Constants:
# {{ IP_SERVER }} to get service IP address
# {{ PORT }} to get service port
description: The client reported that they initially attempted to search for a cracked version of Microsoft Word because the official license was too expensive. They then executed a file they believed to be a legitimate installer. However, the following morning, they discovered that their confidential file could no longer be accessed.

  https://drive.google.com/drive/folders/1IqFL3bf4u_6bzEM3W9CndjGwATbf17r9?usp=sharing
  password : 46fd9b73974cf8c3a3bf71ec6b2830d49341016573364628585d1ca32bea9449
  
  WARNING: This challenge contains live malware, so strictly perform all analysis within an isolated sandbox environment and DO NOT execute any files on your host machine."

